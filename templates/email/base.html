<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light" />
		<title>{% block title %}Legiceptum{% endblock %}</title>
	</head>

	<body style="margin:0; padding:0; background-color:#fff7e1;">
		<!-- Preheader: shown as preview text in the inbox list -->
		<div style="display:none; max-height:0; overflow:hidden; opacity:0; color:#fff7e1;">
			{% block preheader %}{% endblock %}
		</div>

		<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fff7e1;">
			<tr>
				<td align="center" style="padding:32px 16px;">
					<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
						<tr>
							<td align="center" style="padding:0 0 20px 0; font-family:Georgia, 'Times New Roman', serif; font-size:28px; font-weight:bold; letter-spacing:1px; color:#5d481b;">
								Legiceptum
							</td>
						</tr>

						<tr>
							<td style="background-color:#ffffff; border:1px solid #e9dfc8; border-radius:10px; padding:32px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:16px; line-height:1.6; color:#302b20;">
								{% block content %}{% endblock %}
							</td>
						</tr>

						<tr>
							<td align="center" style="padding:20px 16px 0 16px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:13px; line-height:1.5; color:#81765f;">
								{% block footer %}{% endblock %}
								<br />
								Legiceptum &ndash; Deutsche Bundesgesetze einfach nachschlagen
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
