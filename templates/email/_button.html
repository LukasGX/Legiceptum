{# Bulletproof button: a table cell carries the colour so Outlook renders it too #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
	<tr>
		<td align="center" bgcolor="#ffde71" style="border-radius:8px;">
			<a href="{{ url }}" style="display:inline-block; padding:14px 28px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:16px; font-weight:bold; color:#40300a; text-decoration:none; border-radius:8px;">{{ label }}</a>
		</td>
	</tr>
</table>
